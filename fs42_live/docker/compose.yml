# Usage (from this directory):  ./setup.sh   (or: cp .env.example .env, edit it, then:)
#                                docker compose up -d --build
services:
  fs42-live:
    build:
      context: ../..
      dockerfile: fs42_live/docker/Dockerfile
    image: fs42-live:dev
    container_name: fs42-live
    user: "${FS42_UID:?set in .env}:${FS42_GID:?set in .env}"
    # Intel Quick Sync for encoding; the stream falls back to the CPU if it doesn't work
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-991}"
      - "${VIDEO_GID:-44}"
    environment:
      # Schedules are built in local wall-clock time, so this must be the viewers'
      # time zone, not the host's (servers often run in UTC)
      - TZ=${TZ:?set in .env}
    ports:
      - "${FS42_PORT:-4242}:4242"
    volumes:
      - ${FS42_DATA:?set in .env}/confs:/app/confs
      - ${FS42_DATA}/catalog:/app/catalog
      - ${FS42_DATA}/runtime:/app/runtime
      # Catalogs store absolute paths, so media is mounted at the same path as on the host
      - ${MEDIA_ROOT:?set in .env}:${MEDIA_ROOT}:ro
      # a Jellyfin API key, so a schedule change refreshes Jellyfin's guide (none: it doesn't)
      - ${JELLYFIN_KEY_FILE:-/dev/null}:/run/secrets/jellyfin_key:ro
    # Jellyfin, reached through the host's port
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # WeatherStar 4000+ for the weather channel; fs42-live renders it at http://ws4kp:8080
  ws4kp:
    image: ghcr.io/netbymatt/ws4kp:latest
    container_name: fs42-ws4kp
    restart: unless-stopped
