<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>FieldStation42 Live</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
                     font-family: "Courier New", monospace; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        /* the shows are 4:3, so the static is too, leaving the channel number and buttons outside it */
        #snow { position: fixed; inset: 0; margin: auto; width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); image-rendering: pixelated; pointer-events: none; }
        #snow.hidden { display: none; }
        #osd { position: fixed; top: 6%; right: 6%; font-size: clamp(28px, 7vw, 72px); color: #3f3;
               text-shadow: 3px 3px 0 #000; pointer-events: none; transition: opacity .4s; text-align: right; }
        #osd small { display: block; font-size: .45em; }
        #osd.hidden { opacity: 0; }
        #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                 background: #000; font-size: 28px; cursor: pointer; border: 0; color: #fff; width: 100%; font-family: inherit; }
        #start[hidden] { display: none; }
        #controls { position: fixed; bottom: 4%; right: 4%; display: flex; flex-direction: column; gap: 12px;
                    transition: opacity .4s; }
        #controls.hidden { opacity: 0; pointer-events: none; }
        #controls button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #888;
                           background: rgba(0,0,0,.5); color: #fff; font-size: 28px; cursor: pointer; }
    </style>
</head>
<body>
    <video id="tv" playsinline></video>
    <canvas id="snow" width="160" height="120"></canvas>
    <div id="osd" class="hidden"></div>
    <div id="controls" class="hidden">
        <button id="up" aria-label="Channel up">&#9650;</button>
        <button id="down" aria-label="Channel down">&#9660;</button>
    </div>
    <button id="start">&#9654; Tap to turn on</button>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.js"></script>
    <script>
        const video = document.getElementById("tv");
        const osd = document.getElementById("osd");
        const controls = document.getElementById("controls");
        // The raw TS stream starts fastest (no segments to wait for); it needs Media Source
        // Extensions, which iPhones only have from iOS 17.1. Older ones get HLS.
        const raw = mpegts.getFeatureList().mseLivePlayback;
        const STALL = 15000; // ms without the picture moving
        let channels = [], current = 0, player = null, retry, typed = "", typedTimer, osdTimer;
        let lastTime = -1, lastMoved = 0;

        function remember(n) { try { localStorage.setItem("fs42-channel", n); } catch (e) {} }
        function remembered() { try { return Number(localStorage.getItem("fs42-channel")); } catch (e) { return 0; } }

        function showOsd(text, sub) {
            osd.innerHTML = text + (sub ? `<small>${sub}</small>` : "");
            osd.classList.remove("hidden");
            controls.classList.remove("hidden");
            clearTimeout(osdTimer);
            osdTimer = setTimeout(() => { osd.classList.add("hidden"); controls.classList.add("hidden"); }, 3000);
        }

        function retune() { clearTimeout(retry); retry = setTimeout(() => tune(current), 2000); }

        function tune(index) {
            clearTimeout(retry);
            current = (index + channels.length) % channels.length;
            const ch = channels[current];
            showOsd(ch.channel, ch.display);
            remember(ch.channel);
            history.replaceState(null, "", "#" + ch.channel);
            lastMoved = Date.now();
            snow.classList.remove("hidden");
            if (player) { player.destroy(); player = null; }
            if (raw) {
                video.disableRemotePlayback = true; // iOS's ManagedMediaSource wants this
                player = mpegts.createPlayer({ type: "mpegts", isLive: true, url: `/live/stream/${ch.channel}.ts?surf=1` },
                    { enableStashBuffer: false, liveBufferLatencyChasing: true, liveBufferLatencyMaxLatency: 3 });
                player.attachMediaElement(video);
                player.load();
                player.on(mpegts.Events.ERROR, retune);
            } else {
                video.src = `/live/hls/${ch.channel}/index.m3u8`;
            }
            play();
            warm();
        }

        // keep the channels either side running, so flipping to one is instant; the server
        // stops any that aren't named again within a few seconds
        let warmNeighbours = 0;
        function warm() {
            if (!warmNeighbours || document.hidden) return;
            const near = new Set();
            for (let d = 1; d <= warmNeighbours; d++) {
                near.add(channels[(current + d) % channels.length].channel);
                near.add(channels[((current - d) % channels.length + channels.length) % channels.length].channel);
            }
            near.delete(channels[current].channel);
            if (near.size) fetch(`/live/warm?channels=${[...near].join(",")}`, { method: "POST" }).catch(() => {});
        }
        setInterval(warm, 2000);
        document.addEventListener("visibilitychange", warm); // back from another tab: warm again right away

        const start = document.getElementById("start");
        function play() {
            video.play().catch(e => {
                // a phone may want its own tap before playing sound
                if (e.name === "NotAllowedError") { start.textContent = "▶ Tap to play"; start.hidden = false; }
            });
        }

        video.addEventListener("error", () => !raw && retune());
        video.addEventListener("playing", () => snow.classList.add("hidden"));

        // static while a channel tunes in, like an old set
        const snow = document.getElementById("snow");
        const ctx = snow.getContext("2d");
        const noise = ctx.createImageData(snow.width, snow.height);
        (function drawSnow() {
            if (!snow.classList.contains("hidden")) {
                const d = noise.data;
                for (let i = 0; i < d.length; i += 4) { d[i] = d[i + 1] = d[i + 2] = Math.random() * 255; d[i + 3] = 255; }
                ctx.putImageData(noise, 0, 0);
            }
            requestAnimationFrame(drawSnow);
        })();
        setInterval(() => {
            if (!channels.length || video.paused) return;
            if (video.currentTime !== lastTime) { lastTime = video.currentTime; lastMoved = Date.now(); }
            else if (Date.now() - lastMoved > STALL) tune(current);
        }, 1000);

        function tuneNumber(n) {
            const i = channels.findIndex(c => c.channel === n);
            if (i >= 0) tune(i); else showOsd(n, "No channel");
        }

        document.addEventListener("keydown", e => {
            if (!channels.length) return;
            if (e.key === "ArrowUp" || e.key === "PageUp") tune(current + 1);
            else if (e.key === "ArrowDown" || e.key === "PageDown") tune(current - 1);
            else if (/^[0-9]$/.test(e.key)) {
                typed += e.key;
                showOsd(typed + "-");
                clearTimeout(typedTimer);
                typedTimer = setTimeout(() => { tuneNumber(Number(typed)); typed = ""; }, 1200);
            } else if (e.key === "f") {
                document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
            }
        });
        document.getElementById("up").onclick = e => { e.stopPropagation(); tune(current + 1); };
        document.getElementById("down").onclick = e => { e.stopPropagation(); tune(current - 1); };
        video.addEventListener("click", () => channels.length && showOsd(channels[current].channel, channels[current].display));

        start.onclick = async () => {
            if (channels.length) { start.hidden = true; play(); return; }
            start.textContent = "Warming up…";
            const status = await (await fetch("/live/status")).json();
            channels = status.channels.sort((a, b) => a.channel - b.channel);
            warmNeighbours = status.warm_neighbours || 0;
            start.hidden = true;
            const wanted = Number(location.hash.slice(1)) || remembered();
            const i = channels.findIndex(c => c.channel === wanted);
            tune(i >= 0 ? i : 0);
        };
    </script>
</body>
</html>
