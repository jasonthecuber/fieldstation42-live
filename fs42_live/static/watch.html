<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- iPhones can't take a page full screen; added to the home screen, it opens edge to edge -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/live/watch.webmanifest">
    <title>FieldStation42 Live</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
                     font-family: "Courier New", monospace; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        /* the shows are 4:3, so the static is too, leaving the channel number and buttons outside it */
        #snow { position: fixed; inset: 0; margin: auto; width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4)); image-rendering: pixelated; pointer-events: none; }
        #snow.hidden { display: none; }
        #osd { position: fixed; top: 6%; right: 6%; font-size: clamp(28px, 7vw, 72px); color: #3f3;
               text-shadow: 3px 3px 0 #000; pointer-events: none; transition: opacity .4s; text-align: right; }
        #osd small { display: block; font-size: .45em; }
        #osd.hidden { opacity: 0; }
        #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                 background: #000; font-size: 28px; cursor: pointer; border: 0; color: #fff; width: 100%; font-family: inherit; }
        #start[hidden] { display: none; }
        #controls { position: fixed; bottom: 4%; right: 4%; display: flex; flex-direction: column; gap: 12px;
                    transition: opacity .4s; }
        #controls.hidden { opacity: 0; pointer-events: none; }
        /* a TV browser's pointer (Samsung) hides while it sits still */
        body.idle, body.idle * { cursor: none !important; }
        /* the same, as a see-through image, so the pointer can be switched between two hidden kinds */
        body.idle.alt, body.idle.alt * { cursor: url(data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7) 0 0, none !important; }
        #controls button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #888;
                           background: rgba(0,0,0,.5); color: #fff; font-size: 28px; cursor: pointer; }
        /* on demand: a pause button in the middle and a progress line, shown with the controls (and while paused) */
        #still { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        #pause { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 96px; height: 96px;
                 border-radius: 50%; border: 2px solid #888; background: rgba(0,0,0,.5); color: #fff; font-size: 36px;
                 cursor: pointer; transition: opacity .4s; }
        #progress { position: fixed; left: 4%; right: calc(8% + 64px); bottom: 4%; transition: opacity .4s; pointer-events: none;
                    font-size: clamp(14px, 2.5vh, 22px); text-shadow: 2px 2px 0 #000; }
        #progress div { height: 6px; background: rgba(255,255,255,.3); margin-top: 6px; }
        #progress div div { height: 100%; width: 0; background: #3f3; margin: 0; }
        #controls.hidden ~ #pause, #controls.hidden ~ #progress { opacity: 0; pointer-events: none; }
        body.paused #controls.hidden ~ #pause, body.paused #controls.hidden ~ #progress { opacity: 1; }
        body.paused #controls.hidden ~ #pause { pointer-events: auto; }
        #pause[hidden], #progress[hidden], #still[hidden] { display: none; }
        /* the menu, in the style of an old set's on-screen menu */
        #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                background: rgba(0,0,0,.45); font-size: clamp(16px, 3.2vh, 30px); }
        #menu[hidden], #menu [hidden] { display: none; }
        #menu .panel { background: #1c2a8c; border: 4px solid #ccc; padding: 1em 1.4em; min-width: min(80vw, 16em);
                       max-width: 90vw; max-height: 86vh; overflow-y: auto; box-shadow: 8px 8px 0 #000; }
        #menu h2 { margin: 0 0 .6em; font-size: 1.2em; color: #ff3; text-shadow: 2px 2px 0 #000; }
        #menu button, #menu input { display: block; width: 100%; box-sizing: border-box; margin: .25em 0; padding: .35em .5em;
                                    font: inherit; color: #fff; background: transparent; border: 2px solid transparent;
                                    text-align: left; cursor: pointer; }
        #menu button b { color: #ff3; margin-right: .6em; }
        #menu button:focus, #menu input:focus { outline: none; border-color: #ff3; background: rgba(255,255,255,.12); }
        #menu button.on { background: #3f3; color: #000; }
        #menu button.on b { color: #000; }
        #menu input { border-color: #888; background: rgba(0,0,0,.3); cursor: text; }
        #menu .note, #menu .keys { font-size: .7em; color: #ccc; margin: .5em 0 0; }
        #menu #reportMsg { color: #ff3; min-height: 1.2em; }
    </style>
</head>
<body>
    <video id="tv" playsinline></video>
    <canvas id="still" hidden></canvas>
    <canvas id="snow" width="160" height="120"></canvas>
    <div id="osd" class="hidden"></div>
    <div id="controls" class="hidden">
        <button id="menuButton" aria-label="Menu">&#9776;</button>
        <button id="up" aria-label="Channel up">&#9650;</button>
        <button id="down" aria-label="Channel down">&#9660;</button>
        <button id="full" aria-label="Full screen">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>
        </button>
    </div>
    <button id="pause" hidden aria-label="Pause">&#10074;&#10074;</button>
    <div id="progress" hidden><span id="progressTime"></span><div><div></div></div></div>
    <div id="menu" hidden>
        <div class="panel" id="mainPanel">
            <h2>Menu</h2>
            <button data-key="1" data-go="channelPanel"><b>1</b>Channels</button>
            <button data-key="2" data-go="reportPanel"><b>2</b>Report a problem</button>
            <button data-key="3" id="odButton"><b>3</b>Watch this from the start</button>
            <button data-key="0" data-close><b>0</b>Close</button>
            <p id="mainMsg" class="note"></p>
            <p class="keys">Back or Info closes the menu</p>
        </div>
        <div class="panel" id="channelPanel" hidden>
            <h2>Channels</h2>
            <div id="channelList"></div>
            <p class="keys">Or type a channel number</p>
        </div>
        <div class="panel" id="reportPanel" hidden>
            <h2>Report a problem</h2>
            <button data-pick="1"><b>1</b>Wrong bumper or ad</button>
            <button data-pick="2"><b>2</b>Static or frozen</button>
            <button data-pick="3"><b>3</b>Sound problem</button>
            <button data-pick="4"><b>4</b>Wrong show or listing</button>
            <button data-pick="5"><b>5</b>Something else</button>
            <input id="note" maxlength="1000" placeholder="Tell us more (optional)" autocomplete="off">
            <button id="send"><b>&#10003;</b>Send</button>
            <p id="reportMsg"></p>
            <p class="note" id="reportWhen"></p>
        </div>
    </div>
    <button id="start">&#9654; Tap to turn on</button>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.js"></script>
    <script>
        const video = document.getElementById("tv");
        const osd = document.getElementById("osd");
        const controls = document.getElementById("controls");
        // The raw TS stream starts fastest (no segments to wait for); it needs Media Source
        // Extensions, which iPhones only have from iOS 17.1. Older ones get HLS.
        const raw = mpegts.getFeatureList().mseLivePlayback;
        const STALL = 15000; // ms without the picture moving
        let channels = [], current = 0, player = null, retry, typed = "", typedTimer, osdTimer;
        let lastTime = -1, lastMoved = 0;

        function remember(n) { try { localStorage.setItem("fs42-channel", n); } catch (e) {} }
        function remembered() { try { return Number(localStorage.getItem("fs42-channel")); } catch (e) { return 0; } }

        function showOsd(text, sub) {
            osd.innerHTML = text + (sub ? `<small>${sub}</small>` : "");
            osd.classList.remove("hidden");
            controls.classList.remove("hidden");
            clearTimeout(osdTimer);
            osdTimer = setTimeout(() => { osd.classList.add("hidden"); controls.classList.add("hidden"); }, 3000);
        }

        // retries after a dropped or stuck stream wait longer each time (2, 4, 8, 16, then 30 s), since each
        // builds a new player and a TV browser runs short of memory; a picture playing resets it
        let fails = 0;
        function retune() {
            clearTimeout(retry);
            if (od) { // on demand: start again from where it got to (unless that's the end)
                if (od.duration - odPos() < 10) return backToLive();
                od.at = odPos();
                odZero = null;
                retry = setTimeout(playOd, Math.min(2000 * 2 ** fails++, 30000));
                return;
            }
            // a TV browser's video can die for good after a lot of surfing (the stream keeps arriving, the
            // picture never starts); a fresh page is the closest the page can get to restarting the browser
            if (fails >= 3 && mayReload()) {
                logEvent("reloading the page");
                try { sessionStorage.setItem("fs42-autostart", "1"); } catch (e) {}
                setTimeout(() => location.reload(), 500);
                return;
            }
            retry = setTimeout(() => tune(current), Math.min(2000 * 2 ** fails++, 30000));
        }
        function mayReload() { // at most once in 10 minutes, so a dead server doesn't loop the page
            try {
                if (Date.now() - Number(sessionStorage.getItem("fs42-reloaded") || 0) < 600000) return false;
                sessionStorage.setItem("fs42-reloaded", Date.now());
                return true;
            } catch (e) { return false; }
        }

        // what the player runs into, to the server's log, since a TV browser has nowhere to show it
        let tunes = 0, lastLog = 0;
        function logEvent(event, detail = "") {
            if (Date.now() - lastLog < 1000) return;
            lastLog = Date.now();
            const err = video.error ? ` error=${video.error.code}` : "";
            const state = `tunes=${tunes} fails=${fails} ready=${video.readyState} net=${video.networkState}${err} paused=${video.paused}`;
            fetch("/live/player/log", { method: "POST", body: `ch ${channels[current] ? channels[current].channel : "-"} ${event} ${detail} | ${state}` }).catch(() => {});
        }

        function stopPlayer() {
            if (!player) return;
            player.destroy();
            player = null;
            video.removeAttribute("src");
            video.load(); // lets the browser free the old stream's decoder and buffers now, not later
        }

        function tune(index) {
            clearTimeout(retry);
            endOd();
            tunes++;
            // the Samsung wakes its pointer when the stream changes (remote, typed number or a retry after a
            // dropped stream); if it was hidden, keep it hidden
            if (document.body.classList.contains("idle")) { hideSoon(); hiddenTuneAt = Date.now(); }
            current = (index + channels.length) % channels.length;
            const ch = channels[current];
            showOsd(ch.channel, ch.display);
            remember(ch.channel);
            history.replaceState(history.state, "", "#" + ch.channel); // (keeps the menu's entry, if it's open)
            lastMoved = Date.now();
            snow.classList.remove("hidden");
            stopPlayer();
            if (raw) {
                video.disableRemotePlayback = true; // iOS's ManagedMediaSource wants this
                // autoCleanup drops video already played (the default keeps all of it, hours on a TV left on)
                player = mpegts.createPlayer({ type: "mpegts", isLive: true, url: `/live/stream/${ch.channel}.ts?surf=1` },
                    { enableStashBuffer: false, liveBufferLatencyChasing: true, liveBufferLatencyMaxLatency: 3,
                      autoCleanupSourceBuffer: true, autoCleanupMaxBackwardDuration: 30, autoCleanupMinBackwardDuration: 10 });
                player.attachMediaElement(video);
                player.load();
                player.on(mpegts.Events.ERROR, (type, detail, info) => {
                    logEvent("error", `${type} ${detail} ${info && info.msg ? info.msg : ""}`);
                    retune();
                });
            } else {
                video.src = `/live/hls/${ch.channel}/index.m3u8`;
            }
            play();
            warm();
        }

        // on demand: the show on a channel from its start (from the menu). od.at is where the stream began, in
        // seconds into the file; skipping starts a new stream from the new point, and so does playing after a long pause
        let od = null, odZero = null, pausedTimer;
        const pauseButton = document.getElementById("pause"), progress = document.getElementById("progress");
        const still = document.getElementById("still");
        const odPos = () => od.at + (odZero === null ? 0 : Math.max(0, video.currentTime - odZero));
        const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
        function clock(s) {
            s = Math.max(0, Math.floor(s));
            const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, "0");
            return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
        }

        async function watchFromStart() {
            const msg = document.getElementById("mainMsg");
            msg.textContent = "Finding it…";
            try {
                const r = await fetch(`/live/ondemand/now/${channels[current].channel}`);
                if (!r.ok) throw new Error(r.status);
                const show = await r.json();
                closeMenu();
                od = { ...show, at: 0 };
                playOd();
            } catch (e) {
                msg.textContent = "Nothing to watch from the start on this channel";
            }
        }
        function playOd() {
            clearTimeout(retry);
            clearTimeout(pausedTimer);
            tunes++;
            if (document.body.classList.contains("idle")) { hideSoon(); hiddenTuneAt = Date.now(); }
            od.stopped = false;
            odZero = null;
            lastMoved = Date.now();
            document.body.classList.remove("paused");
            pauseButton.innerHTML = "&#10074;&#10074;";
            pauseButton.hidden = progress.hidden = false;
            snow.classList.remove("hidden");
            stopPlayer();
            player = mpegts.createPlayer({ type: "mpegts", isLive: true,
                    url: `/live/ondemand/${od.channel}.ts?file=${encodeURIComponent(od.file)}&start=${od.at.toFixed(1)}` },
                { enableStashBuffer: false, autoCleanupSourceBuffer: true, autoCleanupMaxBackwardDuration: 30, autoCleanupMinBackwardDuration: 10 });
            player.attachMediaElement(video);
            player.load();
            player.on(mpegts.Events.ERROR, (type, detail, info) => {
                logEvent("on demand error", `${type} ${detail} ${info && info.msg ? info.msg : ""}`);
                retune();
            });
            play();
            showOdOsd();
        }
        function endOd() {
            if (!od) return;
            od = null;
            clearTimeout(pausedTimer);
            document.body.classList.remove("paused");
            pauseButton.hidden = progress.hidden = still.hidden = true;
        }
        function backToLive() { endOd(); tune(current); }
        function showOdOsd() {
            showOsd((video.paused ? "&#10074;&#10074; " : "") + clock(odPos()), esc(od.title === od.name ? od.name : `${od.title}: ${od.name}`));
            showProgress();
        }
        function showProgress() {
            progress.querySelector("div div").style.width = `${Math.min(100, 100 * odPos() / od.duration)}%`;
            document.getElementById("progressTime").textContent = `${clock(odPos())} / ${clock(od.duration)}`;
        }
        function seekOd(by) {
            od.at = Math.max(0, Math.min(odPos() + by, od.duration - 5));
            playOd();
        }
        function togglePause() {
            clearTimeout(pausedTimer);
            if (od.stopped) return playOd();
            if (video.paused) {
                play();
                document.body.classList.remove("paused");
            } else {
                video.pause();
                document.body.classList.add("paused");
                // a long pause stops the stream, or the server keeps encoding into it; the last picture stays up
                pausedTimer = setTimeout(() => {
                    try {
                        still.width = video.videoWidth;
                        still.height = video.videoHeight;
                        still.getContext("2d").drawImage(video, 0, 0);
                        still.hidden = false;
                    } catch (e) {}
                    od.at = odPos();
                    odZero = null;
                    od.stopped = true;
                    stopPlayer();
                }, 20000);
            }
            pauseButton.innerHTML = video.paused ? "&#9654;" : "&#10074;&#10074;";
            showOdOsd();
        }
        pauseButton.onclick = e => { e.stopPropagation(); togglePause(); };

        // true if on demand took the key: OK (or play/pause) pauses, left and right skip 30 s, Back goes back to live TV
        function odKeys(e) {
            const k = e.key, c = e.keyCode;
            if ((k === "Enter" && !e.target.closest?.("button")) || k === " " || k === "MediaPlayPause" || c === 10252
                || ((k === "MediaPlay" || c === 415) && video.paused) || ((k === "MediaPause" || c === 19) && !video.paused)) togglePause();
            else if (k === "ArrowLeft" || k === "MediaRewind" || c === 412) seekOd(-30);
            else if (k === "ArrowRight" || k === "MediaFastForward" || c === 417) seekOd(30);
            else if (k === "Escape" || k === "GoBack" || k === "BrowserBack" || c === 10009 || k === "Backspace" || k === "MediaStop" || c === 413) backToLive();
            else return false;
            return true;
        }

        // keep the channels either side running, so flipping to one is instant; the server
        // stops any that aren't named again within a few seconds
        let warmNeighbours = 0;
        function warm() {
            if (!warmNeighbours || document.hidden || od) return;
            const near = new Set();
            for (let d = 1; d <= warmNeighbours; d++) {
                near.add(channels[(current + d) % channels.length].channel);
                near.add(channels[((current - d) % channels.length + channels.length) % channels.length].channel);
            }
            near.delete(channels[current].channel);
            if (near.size) fetch(`/live/warm?channels=${[...near].join(",")}`, { method: "POST" }).catch(() => {});
        }
        setInterval(warm, 2000);
        document.addEventListener("visibilitychange", warm); // back from another tab: warm again right away

        const start = document.getElementById("start");
        function play() {
            video.play().catch(e => {
                // a phone may want its own tap before playing sound
                if (e.name === "NotAllowedError") { start.textContent = "▶ Tap to play"; start.hidden = false; }
            });
        }

        video.addEventListener("error", () => { logEvent("video error"); if (!raw) retune(); });
        let reloaded = false;
        try { reloaded = !!sessionStorage.getItem("fs42-autostart"); } catch (e) {}
        video.addEventListener("playing", () => {
            snow.classList.add("hidden");
            still.hidden = true;
            if (od && odZero === null) odZero = video.currentTime; // where this stream's od.at is
            if (fails || reloaded) logEvent(reloaded ? "playing after a page reload" : "playing again");
            fails = 0;
            reloaded = false;
            if (document.body.classList.contains("idle")) hideSoon();  // the new picture can wake the Samsung's pointer too
        });

        // static while a channel tunes in, like an old set
        const snow = document.getElementById("snow");
        const ctx = snow.getContext("2d");
        const noise = ctx.createImageData(snow.width, snow.height);
        (function drawSnow() {
            if (!snow.classList.contains("hidden")) {
                const d = noise.data;
                for (let i = 0; i < d.length; i += 4) { d[i] = d[i + 1] = d[i + 2] = Math.random() * 255; d[i + 3] = 255; }
                ctx.putImageData(noise, 0, 0);
            }
            requestAnimationFrame(drawSnow);
        })();
        setInterval(() => {
            if (!channels.length || video.paused) return;
            if (od) {
                showProgress();
                // the end of the show (its stream just stops): back to live TV
                const left = od.duration - odPos();
                if (odZero !== null && (left < 1.5 || (left < 10 && video.currentTime === lastTime && Date.now() - lastMoved > 3000))) {
                    logEvent("on demand finished");
                    return backToLive();
                }
            }
            if (video.currentTime !== lastTime) { lastTime = video.currentTime; lastMoved = Date.now(); }
            else if (Date.now() - lastMoved > STALL) { // (no re-check while it waits)
                logEvent("stalled");
                lastMoved = Date.now() + 30000;
                retune();
            }
        }, 1000);

        function tuneNumber(n) {
            const i = channels.findIndex(c => c.channel === n);
            if (i >= 0) tune(i); else showOsd(n, "No channel");
        }

        // full screen: double-tap, the button, OK on a TV remote, or f. iPhones have no full
        // screen for a page (only for a bare video, which would lose the channel buttons).
        const root = document.documentElement;
        const canFull = !!(root.requestFullscreen || root.webkitRequestFullscreen);
        const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
        function enterFull() {
            if (!canFull || isFull()) return;
            const request = root.requestFullscreen ? root.requestFullscreen() : root.webkitRequestFullscreen();
            // phones turn sideways, like the shows
            Promise.resolve(request).then(() => screen.orientation?.lock?.("landscape")).catch(() => {});
        }
        function toggleFull() {
            if (!isFull()) enterFull();
            else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        }
        const full = document.getElementById("full");
        full.hidden = !canFull;
        full.onclick = e => { e.stopPropagation(); toggleFull(); };
        // on demand, a double tap on the left or right third skips back or ahead instead
        document.addEventListener("dblclick", e => {
            if (e.target.closest("button, #menu")) return;
            if (od && e.clientX < innerWidth / 3) seekOd(-30);
            else if (od && e.clientX > innerWidth * 2 / 3) seekOd(30);
            else toggleFull();
        });

        document.addEventListener("keydown", e => {
            if (!channels.length || menuKeys(e)) return;
            if (od && odKeys(e)) { e.preventDefault(); return; }
            const k = e.key;
            // TV remotes: the d-pad sends arrows; channel buttons, where a remote has them, send ChannelUp/Down.
            // Samsung's browser keeps those for its pointer, so blue (406) is up and yellow (405) is down.
            if (k === "ArrowUp" || k === "PageUp" || k === "ChannelUp" || e.keyCode === 427 || e.keyCode === 406) tune(current + 1);
            else if (k === "ArrowDown" || k === "PageDown" || k === "ChannelDown" || e.keyCode === 428 || e.keyCode === 405) tune(current - 1);
            else if (/^[0-9]$/.test(k)) {
                typed += k;
                showOsd(typed + "-");
                clearTimeout(typedTimer);
                typedTimer = setTimeout(() => { tuneNumber(Number(typed)); typed = ""; }, 1200);
            } else if (k === "f" || (k === "Enter" && !e.target.closest?.("button"))) {
                toggleFull();
            } else return;
            e.preventDefault(); // so a TV browser doesn't also scroll or move its focus
        });
        let idleTimer, keyAt = 0, hiddenTuneAt = 0;
        function idle() { clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000); }
        // a remote button on a Samsung wakes its pointer with a mouse move; hide it again, it isn't wanted
        // ...and it only looks at the page's "no pointer" rule when the rule changes, so switch between two hidden kinds
        function rehide() { document.body.classList.add("idle"); document.body.classList.toggle("alt"); }
        // one flip per burst: two flips at once cancel out, so the TV sees no change. A key press and the
        // retune it causes both land here; each press restarts the follow-ups instead of adding more.
        let hideTimers = [], lastHide = 0;
        function hideSoon() {
            keyAt = Date.now();
            hideTimers.forEach(clearTimeout);
            if (keyAt - lastHide > 50) rehide();
            lastHide = keyAt;
            hideTimers = [100, 1000].map(ms => setTimeout(rehide, ms));
        }
        // and as a fallback for a wake none of that caught: while it's meant to be hidden, hide it
        // again every few seconds (switching between the two hidden kinds shows nothing)
        setInterval(() => {
            if (document.body.classList.contains("idle") && Date.now() - lastHide > 1500) rehide(); // (clear of the follow-ups)
        }, 3000);
        document.addEventListener("keydown", hideSoon);
        document.addEventListener("mousemove", () => {
            if (Date.now() - keyAt < 1500) return;
            // the new stream can wake it well after the key (a typed number tunes 1.2 s later, then the
            // stream takes a moment), so while a channel tuned with the pointer hidden is still starting, it stays hidden
            if (Date.now() - hiddenTuneAt < 10000 && !snow.classList.contains("hidden")) return;
            document.body.classList.remove("idle");
            controls.classList.remove("hidden");  // the pointer is out, so it may want the buttons
            clearTimeout(osdTimer);
            osdTimer = setTimeout(() => { osd.classList.add("hidden"); controls.classList.add("hidden"); }, 3000);
            idle();
        });
        idle();
        document.getElementById("up").onclick = e => { e.stopPropagation(); tune(current + 1); };
        document.getElementById("down").onclick = e => { e.stopPropagation(); tune(current - 1); };
        video.addEventListener("click", () => {
            if (od) showOdOsd();
            else if (channels.length) showOsd(channels[current].channel, channels[current].display);
        });

        // the menu: Info on a TV remote (i or m on a keyboard), or the ☰ button. Arrows move, OK picks,
        // a number picks its line, Back goes back. A report is stamped with the moment the menu opened.
        const menu = document.getElementById("menu");
        const panels = [...menu.querySelectorAll(".panel")];
        const note = document.getElementById("note"), reportMsg = document.getElementById("reportMsg");
        let openedAt = 0, openedChannel = 0, openedOd = null, pick = 0;
        const odButton = document.getElementById("odButton");
        const menuOpen = () => !menu.hidden;
        const shown = () => panels.find(p => !p.hidden);
        const focusable = () => [...shown().querySelectorAll("button, input")];

        function openMenu() {
            if (!channels.length) return;
            openedAt = Date.now();
            openedChannel = channels[current].channel;
            openedOd = od && { file: od.file, name: od.name, at: odPos() };
            odButton.innerHTML = od ? "<b>3</b>Back to live TV" : "<b>3</b>Watch this from the start";
            odButton.hidden = !raw; // (old iPhones play HLS, which has no on-demand stream yet)
            menu.hidden = false;
            controls.classList.add("hidden");
            history.pushState({ menu: 1 }, "", location.hash); // so a browser's own Back closes the menu, not the page
            showPanel("mainPanel");
        }
        function closeMenu() {
            if (!menuOpen()) return;
            menu.hidden = true;
            document.activeElement?.blur();
            if (history.state?.menu) history.back();
        }
        window.addEventListener("popstate", () => {
            menu.hidden = true;
            if (channels.length) history.replaceState(null, "", "#" + channels[current].channel); // a channel picked meanwhile
        });
        function showPanel(id) {
            panels.forEach(p => p.hidden = p.id !== id);
            if (id === "channelPanel") fillChannels();
            if (id === "reportPanel") startReport();
            document.getElementById("mainMsg").textContent = "";
            const first = id === "channelPanel" ? shown().querySelector(`[data-ch="${channels[current].channel}"]`) : null;
            (first || focusable()[0]).focus();
        }
        function fillChannels() {
            document.getElementById("channelList").replaceChildren(...channels.map((c, i) => {
                const b = document.createElement("button");
                b.dataset.ch = c.channel;
                b.innerHTML = `<b>${c.channel}</b>`;
                b.append(c.display || c.name);
                b.onclick = () => { closeMenu(); tune(i); };
                return b;
            }));
        }
        function startReport() {
            pick = 0;
            note.value = "";
            reportMsg.textContent = "";
            document.querySelectorAll("[data-pick]").forEach(b => b.classList.remove("on"));
            const ch = channels.find(c => c.channel === openedChannel);
            document.getElementById("reportWhen").textContent = openedOd
                ? `${openedOd.name}, the half minute before ${clock(openedOd.at)}`
                : `Channel ${openedChannel} ${ch.display || ch.name}, the half minute before ${new Date(openedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}`;
        }
        function choose(n) {
            pick = n;
            document.querySelectorAll("[data-pick]").forEach(b => b.classList.toggle("on", Number(b.dataset.pick) === n));
            reportMsg.textContent = n === 5 ? "Say what's wrong, then Send" : "";
            (n === 5 ? note : document.getElementById("send")).focus(); // typing is optional, so the TV keyboard only opens for "something else"
        }
        async function send() {
            if (!pick && !note.value.trim()) { reportMsg.textContent = "Pick what's wrong first (1 to 5)"; return; }
            if (pick === 5 && !note.value.trim()) { reportMsg.textContent = "Say what's wrong, then Send"; note.focus(); return; }
            reportMsg.textContent = "Sending…";
            try {
                const r = await fetch("/live/report", { method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ channel: openedChannel, pick, note: note.value, ago: (Date.now() - openedAt) / 1000,
                                           file: openedOd?.file, at: openedOd?.at }) });
                if (!r.ok) throw new Error(r.status);
                const saved = await r.json();
                if (!saved.number) throw new Error("not saved");
                reportMsg.textContent = `Thanks! Saved as report #${saved.number}.`;
                setTimeout(closeMenu, 1500);
            } catch (e) {
                reportMsg.textContent = "Couldn't send it; try again";
            }
        }
        menu.addEventListener("click", e => {
            const b = e.target.closest?.("button");
            if (!b) { if (e.target === menu) closeMenu(); return; } // a tap outside the box closes it
            if (b.dataset.go) showPanel(b.dataset.go);
            else if ("close" in b.dataset) closeMenu();
            else if (b.dataset.pick) choose(Number(b.dataset.pick));
            else if (b.id === "send") send();
            else if (b.id === "odButton") { if (od) { closeMenu(); backToLive(); } else watchFromStart(); }
        });
        document.getElementById("menuButton").onclick = e => { e.stopPropagation(); openMenu(); };

        // true if the menu took the key
        function menuKeys(e) {
            const k = e.key, typing = document.activeElement === note;
            const info = e.keyCode === 457 || k === "Info" || k === "ContextMenu" || (!typing && (k === "i" || k === "m"));
            if (!menuOpen()) {
                if (!info) return false;
                e.preventDefault();
                openMenu();
                return true;
            }
            const back = k === "Escape" || k === "GoBack" || k === "BrowserBack" || e.keyCode === 10009 || (!typing && k === "Backspace");
            if (info || (back && shown().id === "mainPanel")) closeMenu();
            else if (back) showPanel("mainPanel");
            else if (k === "ArrowUp" || k === "ArrowDown") {
                const items = focusable(), at = items.indexOf(document.activeElement);
                const next = items[(at + (k === "ArrowUp" ? -1 : 1) + items.length) % items.length];
                next.focus();
                next.scrollIntoView({ block: "nearest" });
            } else if (k === "Enter") {
                if (typing) send(); else document.activeElement?.closest("#menu button")?.click();
            } else if (/^[0-9]$/.test(k) && !typing) {
                const panel = shown().id;
                if (panel === "channelPanel") { closeMenu(); return false; } // typed channel numbers work as usual
                const b = shown().querySelector(`[data-key="${k}"], [data-pick="${k}"]`);
                if (b) b.click();
            } else if (typing) return true; // letters, spaces and arrows for the note
            else return true;
            e.preventDefault();
            return true;
        }

        start.onclick = async () => {
            // phones and TVs (no mouse) go full screen when turned on; a PC stays in its window
            // (TV browsers can report a fine pointer, so they're matched by name too)
            const tv = /Tizen|Web0S|webOS|SMART-TV|SmartTV|Android TV|BRAVIA/i.test(navigator.userAgent);
            if (tv || !matchMedia("(pointer: fine)").matches) enterFull();
            if (channels.length) { start.hidden = true; play(); return; }
            start.textContent = "Warming up…";
            const status = await (await fetch("/live/status")).json();
            channels = status.channels.sort((a, b) => a.channel - b.channel);
            warmNeighbours = status.warm_neighbours || 0;
            start.hidden = true;
            const wanted = Number(location.hash.slice(1)) || remembered();
            const i = channels.findIndex(c => c.channel === wanted);
            tune(i >= 0 ? i : 0);
        };
        // back from a reload the player did itself: turn on again (full screen needs a key press, though)
        try {
            if (sessionStorage.getItem("fs42-autostart")) { sessionStorage.removeItem("fs42-autostart"); start.onclick(); }
        } catch (e) {}
    </script>
</body>
</html>
