<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live - FieldStation42</title>
    <link rel="stylesheet" href="https://unpkg.com/purecss@3.0.0/build/pure-min.css">
    <link rel="stylesheet" href="https://unpkg.com/purecss@3.0.0/build/grids-responsive-min.css">
    <link rel="stylesheet" id="theme-css" href="/static/themes/default.css">
    <style>
        .live { padding: 1em; max-width: 60em; margin: 0 auto; }
        .live table { width: 100%; margin: 1em 0; }
        .live td, .live th { vertical-align: middle; }
        .live .state-on { font-weight: bold; }
        .live .state-warm { font-style: italic; }
        .live .muted { opacity: 0.6; }
        .live code { user-select: all; word-break: break-all; }
        .live dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.4em 1em; }
        .live dt { font-weight: bold; }
        .live dd { margin: 0; }
    </style>
</head>

<body>
    <script src="/static/fs42_client.js"></script>
    <script src="/static/common.js"></script>
    <script>
        const REFRESH_MS = 3000;

        document.addEventListener('DOMContentLoaded', async function () {
            window.fs42Common.initTheme();
            const base = location.origin;
            const content = `
                <div class="pure-u-1 live">
                    <h2>Live channels</h2>
                    <p>Each channel streams only while someone is watching, and stops about 30 seconds after the last viewer leaves.</p>
                    <table class="pure-table pure-table-horizontal">
                        <thead><tr><th>Ch</th><th>Name</th><th>Status</th><th>Viewers</th><th>Running</th><th>Schedule built to</th><th></th></tr></thead>
                        <tbody id="channels"><tr><td colspan="7">Loading…</td></tr></tbody>
                    </table>
                    <h3>Problem reports</h3>
                    <p>Sent from the player's menu (Info on a TV remote, or ☰), with what played in the half minute before.</p>
                    <table class="pure-table pure-table-horizontal">
                        <thead><tr><th>Seen</th><th>Ch</th><th>Problem</th><th>Playing then</th></tr></thead>
                        <tbody id="reports"><tr><td colspan="4">Loading…</td></tr></tbody>
                    </table>
                    <h3>Messages</h3>
                    <p>A crawl along the bottom of a channel, or the greeting on the greeting channel. Each one ends on its own.</p>
                    <form id="msgForm" class="pure-form pure-form-stacked">
                        <select id="msgWhere"></select>
                        <input id="msgText" maxlength="300" placeholder="Hi Doug!" autocomplete="off" class="pure-input-1">
                        <input id="msgSub" maxlength="200" placeholder="Second line (greeting only)" autocomplete="off" class="pure-input-1">
                        <select id="msgMinutes">
                            <option value="15">for 15 minutes</option><option value="30" selected>for 30 minutes</option>
                            <option value="60">for an hour</option><option value="120">for 2 hours</option><option value="480">for 8 hours</option>
                        </select>
                        <button class="pure-button pure-button-primary">Put it on the air</button>
                        <span id="msgNote" class="muted"></span>
                    </form>
                    <table class="pure-table pure-table-horizontal">
                        <thead><tr><th>Where</th><th>Message</th><th>Until</th><th></th></tr></thead>
                        <tbody id="messages"><tr><td colspan="4">Loading…</td></tr></tbody>
                    </table>
                    <h3>Jellyfin setup</h3>
                    <dl>
                        <dt>M3U tuner</dt><dd><code>${base}/live/channels.m3u</code></dd>
                        <dt>XMLTV guide</dt><dd><code>${base}/live/xmltv.xml</code></dd>
                        <dt>A channel</dt><dd><code>${base}/live/stream/&lt;number&gt;.ts</code></dd>
                        <dt>Watch in a browser</dt><dd><a href="/live/watch">${base}/live/watch</a> (HLS: <code>${base}/live/hls/&lt;number&gt;/index.m3u8</code>)</dd>
                    </dl>
                    <h3>Output</h3>
                    <dl>
                        <dt>Encoder</dt><dd id="encoder">…</dd>
                        <dt>Format</dt><dd id="profile">…</dd>
                    </dl>
                </div>`;
            document.body.innerHTML = await window.fs42Common.createPageLayout('Live', content);
            document.getElementById('msgForm').addEventListener('submit', putMessage);
            refresh();
            setInterval(refresh, REFRESH_MS);
        });

        function duration(seconds) {
            const h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
            return h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`;
        }

        function scheduleEnd(channel) {
            if (channel.type === 'web') return '<span class="muted">(web page)</span>';
            if (!channel.schedule_ends) return '<b>not built</b>';
            const end = new Date(channel.schedule_ends);
            const days = (end - new Date()) / 86400000;
            const text = end.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
            return days < 1 ? `<b>${text}</b>` : text;
        }

        function row(c) {
            const status = !c.running ? '<span class="muted">idle</span>'
                : c.viewers ? '<span class="state-on">streaming</span>'
                : c.warm ? '<span class="state-warm">warm</span>'
                : 'stopping soon';
            const cell = document.createElement('tr');
            cell.innerHTML = `
                <td>${c.channel}</td>
                <td></td>
                <td>${status}</td>
                <td>${c.running ? c.viewers : ''}</td>
                <td>${c.running ? duration(c.uptime) + ` <span class="muted">(${c.kbps} kbps)</span>` : ''}</td>
                <td>${scheduleEnd(c)}</td>
                <td>${c.running ? `<button class="pure-button" data-ch="${c.channel}">Restart</button>` : ''}</td>`;
            cell.children[1].textContent = c.name;
            const button = cell.querySelector('button');
            if (button) button.addEventListener('click', () => restart(c));
            return cell;
        }

        async function refresh() {
            try {
                const status = await (await fetch('/live/status')).json();
                document.getElementById('channels').replaceChildren(...status.channels.map(row));
                fillWhere(status.channels);
                document.getElementById('encoder').textContent = status.encoder;
                document.getElementById('profile').textContent = status.profile;
            } catch (e) {
                console.warn('live status failed', e);
            }
            try {
                const reports = await (await fetch('/live/reports')).json();
                document.getElementById('reports').replaceChildren(...(reports.length ? reports.map(reportRow) : [emptyReports()]));
            } catch (e) {
                console.warn('reports failed', e);
            }
            try {
                const on = await (await fetch('/live/messages')).json();
                const rows = Object.entries(on).map(([key, m]) => messageRow(key, m));
                document.getElementById('messages').replaceChildren(...(rows.length ? rows : [emptyRow(4, 'Nothing on the air')]));
            } catch (e) {
                console.warn('messages failed', e);
            }
        }

        // where a message can go: every channel's crawl, one channel's, or the greeting channel
        function fillWhere(channels) {
            const where = document.getElementById('msgWhere');
            if (where.options.length) return;
            const option = (value, text) => { const o = document.createElement('option'); o.value = value; o.textContent = text; return o; };
            where.append(option('greeting', 'Greeting channel (big title card)'), option('crawl:all', 'Crawl on every channel'),
                ...channels.map(c => option(`crawl:${c.channel}`, `Crawl on ${c.channel} ${c.name}`)));
        }

        function whereName(key) {
            if (key === 'greeting') return 'Greeting channel';
            const ch = key.split(':')[1];
            return ch === 'all' ? 'Crawl, every channel' : `Crawl, channel ${ch}`;
        }

        async function sendMessage(key, text, sub, minutes) {
            const [kind, channel] = key.split(':');
            const r = await fetch('/live/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ kind, channel, text, sub, minutes }) });
            if (!r.ok) throw new Error(r.status);
        }

        async function putMessage(e) {
            e.preventDefault();
            const text = document.getElementById('msgText').value.trim();
            const msgNote = document.getElementById('msgNote');
            if (!text) { msgNote.textContent = 'Type a message first'; return; }
            msgNote.textContent = 'Sending…';
            try {
                await sendMessage(document.getElementById('msgWhere').value, text,
                    document.getElementById('msgSub').value.trim(), Number(document.getElementById('msgMinutes').value));
                msgNote.textContent = 'On the air (a crawl shows after a quick reconnect)';
                refresh();
            } catch (err) {
                msgNote.textContent = "Couldn't send it; try again";
            }
        }

        function messageRow(key, m) {
            const cell = document.createElement('tr');
            cell.innerHTML = '<td></td><td></td><td></td><td><button class="pure-button">Take off</button></td>';
            cell.children[0].textContent = whereName(key);
            cell.children[1].textContent = m.text + (m.sub ? ` / ${m.sub}` : '');
            cell.children[2].textContent = new Date(m.until * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            cell.querySelector('button').addEventListener('click', async () => { await sendMessage(key, '', '', 1); refresh(); });
            return cell;
        }

        function emptyRow(columns, text) {
            const cell = document.createElement('tr');
            cell.innerHTML = `<td colspan="${columns}" class="muted"></td>`;
            cell.firstChild.textContent = text;
            return cell;
        }

        function emptyReports() {
            const cell = document.createElement('tr');
            cell.innerHTML = '<td colspan="4" class="muted">None yet</td>';
            return cell;
        }

        function clock(seconds) {
            const s = Math.floor(seconds);
            return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        }

        function reportRow(r) {
            const cell = document.createElement('tr');
            cell.innerHTML = '<td></td><td></td><td></td><td></td>';
            const [seen, ch, problem, played] = cell.children;
            seen.textContent = new Date(r.seen).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' });
            ch.textContent = `${r.channel} ${r.network}`;
            problem.textContent = [r.problem, r.note].filter(Boolean).join(': ');
            played.innerHTML = (r.played || []).map(p => p.error ? '<span class="muted">(no schedule)</span>'
                : `<div></div>`).join('') || '<span class="muted">(web page)</span>';
            (r.played || []).filter(p => !p.error).forEach((p, i) => {
                played.children[i].textContent = `${p.file.split('/').pop()} (${clock(p.from)}–${clock(p.to)})${p.ondemand ? ' on demand' : ''}`;
            });
            return cell;
        }

        async function restart(channel) {
            if (!confirm(`Restart ${channel.name}? Anyone watching will see it reconnect.`)) return;
            await fetch(`/live/channels/${channel.channel}/restart`, { method: 'POST' });
            refresh();
        }
    </script>
</body>

</html>
